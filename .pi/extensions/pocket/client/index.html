<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#101418" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="stylesheet" href="/styles.css" />
		<title>pocket</title>
	</head>
	<body>
		<header id="bar">
			<button id="back" class="ghost" hidden aria-label="Back to sessions">‹ Sessions</button>
			<h1 id="title">pocket</h1>
			<button id="menu" class="ghost" aria-label="Settings and pairing">⋯</button>
		</header>

		<main id="main">
			<!-- Session list -->
			<section id="list" class="view">
				<div id="status" class="hint"></div>
				<ul id="sessions" class="sessions"></ul>
				<button id="new" class="primary">New session</button>
			</section>

			<!-- One conversation -->
			<section id="thread" class="view" hidden>
				<div id="thread-status" class="thread-status"><span id="state" class="pill">…</span><span id="model" class="hint"></span></div>
				<ol id="messages" class="messages"></ol>
				<div id="dialogs" class="dialogs"></div>
				<form id="composer" class="composer">
					<textarea id="input" rows="1" placeholder="Message the session…" enterkeyhint="send"></textarea>
					<button type="submit" id="send" class="primary">Send</button>
				</form>
				<div class="actions">
					<button id="abort" class="ghost">Stop run</button>
					<button id="toggle" class="ghost">Pause</button>
				</div>
			</section>

			<!-- Pairing / settings -->
			<section id="setup" class="view" hidden>
				<h2>Pair this phone</h2>
				<p class="hint">Enter the pairing code the operator printed from <code>/pocket pair</code>. The code lasts ten minutes.</p>
				<label>Gateway <input id="host" type="url" inputmode="url" placeholder="http://127.0.0.1:8787" /></label>
				<label>Pairing code <input id="code" autocapitalize="characters" autocomplete="off" placeholder="8 characters" /></label>
				<label>Name this phone <input id="label" placeholder="pixel" /></label>
				<button id="pair" class="primary">Pair</button>
				<h2>Operator token</h2>
				<p class="hint">A phone can also act as the operator, which is what lets it mint pairing codes.</p>
				<label>Token <input id="token" type="password" autocomplete="off" /></label>
				<button id="save-token" class="ghost">Save token</button>
				<h2>Devices</h2>
				<ul id="devices" class="devices"></ul>
				<button id="revoke" class="ghost">Revoke this phone</button>
				<p id="setup-error" class="error"></p>
			</section>
		</main>

		<script src="/app.js" defer></script>
	</body>
</html>
