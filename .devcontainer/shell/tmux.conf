# tmux config for the pi coding agent (including tmux-backed subagents).
#
# pi runs subagents on a dedicated tmux server/socket
# (~/.pi/agent/tmux-subagents.sock), but tmux still reads this default config.

# Let the agent UI see modified Enter and other enhanced key sequences.
set -g extended-keys on

# tmux 3.5+ supports extended-keys-format; prefer CSI-u there (pi's most
# reliable format). Older versions (3.2-3.4, incl. Debian bookworm's 3.3a)
# do not support the option, so guard it behind a version check.
if-shell -b 'tmux -V | grep -qE " (3\.([5-9]|[0-9]{2})|[4-9])"' 'set -g extended-keys-format csi-u'

# Tell tmux that every attached client can render direct (24-bit) colour, so
# sequences written inside a pane are passed to the outer terminal instead of
# being approximated onto the 256-colour palette. This is a claim about the
# *outer* terminal, and changes nothing an inner program can see: measured on
# tmux 3.3a, `TERM` stays `tmux-256color` and `tput colors` stays 256 with or
# without these two lines.
#
# `terminal-features` needs tmux >= 3.2; `terminal-overrides ",*:Tc"` is the
# older spelling of the same claim.
#
# Accepted trade: `",*:RGB"` asserts this for *every* client, including a
# 256-colour one over SSH, so tmux may then emit 24-bit colour that client
# cannot show. Whether tmux forwards 24-bit only because of these lines cannot
# be measured from inside this container (a detached server has no client whose
# terminal can be inspected), so they stay: they are a deliberate claim, and
# removing them is a behaviour change on real terminals, not a cleanup.
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# *These* two, not the lines above, are what makes pi detect truecolor: tmux
# does not forward COLORTERM, so the variable is supplied here, and
# PI_TRUE_COLOR is the explicit override. Measured inside a pane of a server
# started with this file: `COLORTERM=truecolor`, `PI_TRUE_COLOR=1`.
#
# `setenv -g` reaches only panes created afterwards — measured: a later
# `setenv -g` is absent from an existing pane's `/proc/<pid>/environ` and present
# in a new window — so a long-lived server keeps its old environment until it is
# restarted. See the troubleshooting row in the devcontainer skill.
setenv -g COLORTERM truecolor
setenv -g PI_TRUE_COLOR 1

# Usable scrollback for attaching to long-running subagents.
set -g history-limit 100000

# Mouse scrolling/selection when attached.
set -g mouse on

# Clipboard: copy-mode selections reach the host through OSC 52. A container has
# no X display, so xclip/xsel are not an option; tmux 3.3 writes the escape
# sequence and the outer terminal (VS Code) puts it on the system clipboard.
set -g set-clipboard on
set -g allow-passthrough on

# Copy on selection in copy-mode, and a predictable yank/paste pair.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode C-y send -X copy-selection-and-cancel
