# tmux config for the pi coding agent (including tmux-backed subagents).
#
# pi runs subagents on a dedicated tmux server/socket
# (~/.pi/agent/tmux-subagents.sock), but tmux still reads this default config.

# Let the agent UI see modified Enter and other enhanced key sequences.
set -g extended-keys on

# tmux 3.5+ supports extended-keys-format; prefer CSI-u there (pi's most
# reliable format). Older versions (3.2-3.4, incl. Debian bookworm's 3.3a)
# do not support the option, so guard it behind a version check.
if-shell -b 'tmux -V | grep -qE " (3\.([5-9]|[0-9]{2})|[4-9])"' 'set -g extended-keys-format csi-u'

# Advertise truecolor to programs running inside tmux. Without this tmux reports
# only 256 colors and pi approximates its theme palette, which is what made the
# colors (and the colored tool-call/thinking sections) look different inside a
# tmux panel. `terminal-features` is what tmux actually hands to inner programs
# (via TERM/terminfo); `terminal-overrides` alone only changes outer-terminal
# handling and does not flip pi's color detection.
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# Make sure pi sees a truecolor environment inside tmux even when the outer
# shell did not export COLORTERM (tmux does not forward it by default).
setenv -g COLORTERM truecolor
setenv -g PI_TRUE_COLOR 1

# Usable scrollback for attaching to long-running subagents.
set -g history-limit 100000

# Mouse scrolling/selection when attached.
set -g mouse on

# Clipboard: copy-mode selections reach the host through OSC 52. A container has
# no X display, so xclip/xsel are not an option; tmux 3.3 writes the escape
# sequence and the outer terminal (VS Code) puts it on the system clipboard.
set -g set-clipboard on
set -g allow-passthrough on

# Copy on selection in copy-mode, and a predictable yank/paste pair.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode C-y send -X copy-selection-and-cancel
