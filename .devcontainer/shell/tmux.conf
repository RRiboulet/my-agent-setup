# tmux config for the pi coding agent (including tmux-backed subagents).
#
# pi runs subagents on a dedicated tmux server/socket
# (~/.pi/agent/tmux-subagents.sock), but tmux still reads this default config.

# Let the agent UI see modified Enter and other enhanced key sequences.
set -g extended-keys on

# Usable scrollback for attaching to long-running subagents.
set -g history-limit 100000

# Mouse scrolling/selection when attached.
set -g mouse on
